name: Build and push image to ECR

on:
  push:
    branches:
      - gitops
    paths:
      - app.py
      - requirements.txt
      - Dockerfile
      - .github/workflows/build-ecr.yml
  workflow_dispatch:

permissions:
  id-token: write
  contents: write

concurrency:
  group: gitops-image-build
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tech-challenge-2-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: gitops-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Update GitOps image tag
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          git fetch origin gitops

          # Avoid deploying an image built from older application files.
          if ! git diff --quiet "$GITHUB_SHA" origin/gitops -- app.py requirements.txt Dockerfile; then
            echo "Application files changed during this build. A newer run must deploy them."
            exit 1
          fi

          git checkout -B gitops origin/gitops

          sed -i "s|^  tag:.*|  tag: \"$IMAGE_TAG\"|" helm/tech-challenge-2/values-gitops.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/tech-challenge-2/values-gitops.yaml

          if git diff --cached --quiet; then
            echo "Image tag is already current."
          else
            git commit -m "Update GitOps image to $IMAGE_TAG"
            git push origin HEAD:gitops
          fi